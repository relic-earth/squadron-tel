<main>
  <p class="eyebrow">Account</p>
  <h1>Reset your <em>password.</em></h1>
  <div class="error" id="err"></div>
  <div id="body"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token');
async function api(body) {
  const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}
function askForm() {
  $('body').innerHTML = `<div class="card"><p class="big">Enter the email you use for Squadron, and we will email you a link to choose a new password.</p>
    <form class="two" onsubmit="event.preventDefault();ask()"><input class="input" id="email" type="email" placeholder="Email" autocomplete="email" required><button class="btn" type="submit" id="go">Email me a reset link</button></form></div>`;
}
async function ask() {
  $('err').textContent = ''; $('go').disabled = true;
  try { const j = await api({ action: 'forgot', email: $('email').value.trim() }); $('body').innerHTML = `<div class="card"><p class="big">${j.message}</p><p class="detail">Check your spam folder if it does not arrive within a few minutes.</p></div>`; }
  catch (e) { $('err').textContent = e.message; $('go').disabled = false; }
}
function setForm() {
  $('body').innerHTML = `<div class="card"><p class="big">Choose a new password of at least 8 characters.</p>
    <form class="two" onsubmit="event.preventDefault();setPw()"><input class="input" id="pass" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required><button class="btn" type="submit" id="go">Save my new password</button></form></div>`;
}
async function setPw() {
  $('err').textContent = ''; $('go').disabled = true;
  try { await api({ action: 'reset', token, password: $('pass').value }); $('body').innerHTML = `<div class="card"><p class="big">Your password is changed, and you are signed in.</p><div class="actions"><a class="btn small" href="/account">Go to your account</a></div></div>`; }
  catch (e) { $('err').textContent = e.message; $('go').disabled = false; }
}
token ? setForm() : askForm();
</script>
