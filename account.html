<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your account — Squadron</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/onboard.css">
<style>
.card{border-radius:12px;background:#fff;border:2px solid rgba(11,30,69,0.1);padding:26px 28px;margin-bottom:18px}
.big{font-size:20px;line-height:1.55;color:var(--white);font-weight:600}
.detail{font-size:17px;line-height:1.55;color:var(--slate);font-weight:500;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.biz h3{font-size:24px;font-weight:800;margin-bottom:6px;word-break:break-word}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.error:not(:empty){display:block}
.tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:12px;border:1px solid rgba(11,30,69,0.25);color:var(--slate);margin-left:8px;vertical-align:middle}
.tag.on{color:var(--green);border-color:rgba(34,217,90,0.5)}
.okmsg{display:none;margin:0 0 18px;padding:16px 20px;border-radius:12px;background:#EEF4FF;border:2px solid rgba(31,95,209,0.35);color:#0B1E45;font-size:18px;font-weight:600;line-height:1.5}
.people{list-style:none;margin:16px 0 4px;padding:0}
.people .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid rgba(11,30,69,0.1);font-size:18px;font-weight:600;color:var(--white);word-break:break-word}
.people .row .tag{margin-left:0}
.switchrow{display:flex;align-items:center;gap:16px;margin-top:16px}
.switch{flex:none;width:64px;height:36px;border-radius:999px;border:2px solid rgba(11,30,69,0.25);background:#E9EDF3;position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(11,30,69,0.3);transition:left .15s}
.switch[aria-checked="true"]{background:#1F5FD1;border-color:#1F5FD1}
.switch[aria-checked="true"] span{left:31px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="https://island.contact/snippet.js" data-site="squadron" defer></script>
<script src="/accept.js"></script>
</head>
<body>
<nav>
  <a class="nav-logo" href="/" aria-label="Squadron"><svg class="nav-logo-svg" viewBox="0 -430 2278 492" xmlns="http://www.w3.org/2000/svg" aria-label="Squadron">
      <g transform="translate(0,0)" data-letter="S" data-idx="0"><g class="logo-letter">
        <path d="M 6 -371.28125 L 75 -429.65625 L 199 -429.65625 L 268 -371.28125 L 268.5 -304.921875 L 167.5 -304.921875 L 167.5 -349.015625 L 106.5 -349.015625 L 106.5 -259.5625 L 268 -259.984375 L 270 -57.953125 L 201 0.421875 L 77 0.421875 L 8 -57.953125 L 7.5 -124.3125 L 108.5 -124.3125 L 108.5 -80.21875 L 169.5 -80.21875 L 169.5 -169.6875 L 148.5 -169.6875 L 148.5 -169.265625 L 8 -169.265625 Z" fill="white"/>
      </g></g>
      <g transform="translate(286,0)" data-letter="Q" data-idx="1"><g class="logo-letter">
        <path d="M 200 0.84375 L 187.5 0.84375 L 187.5 63.421875 L 87 63.421875 L 87 0.84375 L 74.5 0.84375 L 5.5 -57.546875 L 5.5 -370.015625 L 74.5 -428.40625 L 198 -428.40625 L 268 -369.1875 L 268 -56.703125 Z M 106 -347.765625 L 106 -82.3125 L 167.5 -82.3125 L 167.5 -346.921875 Z" fill="white"/>
      </g></g>
      <g transform="translate(572,0)" data-letter="U" data-idx="2"><g class="logo-letter">
        <path d="M 6.5 -428.40625 L 108 -428.40625 L 108 -83.15625 L 169 -83.15625 L 169 -352.796875 L 169.5 -352.796875 L 169.5 -429.234375 L 269.5 -429.234375 L 269.5 -58.375 L 200.5 0 L 76.5 0 L 7.5 -58.375 Z" fill="white"/>
      </g></g>
      <g transform="translate(858,0)" data-letter="A" data-idx="3"><g class="logo-letter">
        <path d="M 107.5 0 L 7 0 L 7 -199.078125 L 6.5 -199.078125 L 6.5 -372.546875 L 75.5 -430.921875 L 199.5 -430.921875 L 268.5 -372.546875 L 268.5 -325.078125 L 269.5 0 L 169.5 0 L 168.5 -172.203125 L 107.5 -172.203125 Z M 107 -257.046875 L 168 -257.046875 L 168 -347.765625 L 107 -347.765625 Z" fill="white"/>
      </g></g>
      <g transform="translate(1144,0)" data-letter="D" data-idx="4"><g class="logo-letter">
        <path d="M 269.5 -55.859375 L 200.5 0.84375 L 30 0.421875 L 30 0 L 7.5 0 L 6.5 -429.65625 L 199.5 -429.65625 L 268.5 -371.28125 Z M 108 -83.578125 L 169 -83.578125 L 168 -359.9375 L 107 -359.9375 Z" fill="white"/>
      </g></g>
      <g transform="translate(1430,0)" data-letter="R" data-idx="5"><g class="logo-letter">
        <path d="M 108 0.421875 L 7.5 0.421875 L 7 -430.5 L 200 -430.5 L 269 -372.125 L 269 -324.65625 L 270 -233.515625 L 268.5 -233.09375 L 269 -230.15625 L 250 -214.203125 L 250.5 -214.203125 L 269.5 -198.234375 L 269 -195.296875 L 270.5 -194.875 L 270 0.421875 L 170 0.421875 L 169 -171.78125 L 108 -171.78125 Z M 107.5 -256.625 L 168.5 -256.625 L 168.5 -347.34375 L 107.5 -347.34375 Z" fill="white"/>
      </g></g>
      <g transform="translate(1716,0)" data-letter="O" data-idx="6"><g class="logo-letter">
        <path d="M 202 0.84375 L 76.5 0.84375 L 7.5 -57.546875 L 6.5 -372.546875 L 75.5 -430.921875 L 199 -430.921875 L 269 -371.703125 L 270 -56.703125 Z M 107 -350.28125 L 108 -82.3125 L 169.5 -82.3125 L 168.5 -349.4375 Z" fill="white"/>
      </g></g>
      <g transform="translate(2002,0)" data-letter="N" data-idx="7"><g class="logo-letter">
        <path d="M 109 0.421875 L 8.5 0.421875 L 8.5 -198.65625 L 8 -198.65625 L 7 -430.5 L 108.5 -430.5 L 169.5 -263.34375 L 169.5 -430.5 L 270 -430.5 L 270 -324.65625 L 271 0.421875 L 170 0.421875 L 108.5 -162.546875 Z" fill="white"/>

  <a class="nav-right" href="/billing">Billing</a>

<main>
  <p class="eyebrow">Your account</p>
  <h1>Welcome <em>back.</em></h1>
  <div class="okmsg" id="note"></div>
  <div class="error" id="err"></div>
  <div id="body"><p class="big">Loading.</p></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const params = new URLSearchParams(location.search);
const fmtDate = (d) => new Date(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
async function api(body) {
  const r = await fetch('/api/auth', body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}
function note(html) { $('note').innerHTML = html; $('note').style.display = html ? 'block' : 'none'; }
function loginForm() {
  $('body').innerHTML = `<div class="card"><p class="big">Log in to see your teams, Squadron HQ and billing.</p>
    <form class="two" onsubmit="event.preventDefault();login()"><input class="input" id="email" aria-label="Email" type="email" placeholder="Email" autocomplete="email" required><input class="input" id="pass" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn" type="submit" style="grid-column:1/-1">Log in</button></form>
    <p class="detail" style="margin-top:18px"><a href="/reset" style="color:var(--signal);font-weight:700">Forgot your password?</a></p>
    <p class="detail" style="margin-top:10px">New to Squadron? <a href="/start" style="color:var(--signal);font-weight:700">Get started</a>. Plans start at $39 for 30 days, prepaid.</p></div>`;
}
async function login() {
  $('err').textContent = '';
  try { await api({ action: 'login', email: $('email').value.trim(), password: $('pass').value }); load(); } catch (e) { $('err').textContent = e.message; }
}
async function logout() { await api({ action: 'logout' }); load(); }

// Invitation: /account?invite=TOKEN. The colleague chooses a password and is signed in.
function inviteForm() {
  document.querySelector('h1').innerHTML = 'Join your <em>team.</em>';
  $('body').innerHTML = `<div class="card"><p class="big">You were invited to a Squadron account. Choose a password of at least eight characters to accept the invitation and sign in.</p>
    <p class="detail">You will sign in with the email address the invitation was sent to. You can see conversations in Squadron HQ, answer the knowledge queue, test the team and change settings. Inviting colleagues, changing the account email and deleting the account stay with the account owner.</p>
    <form class="two" onsubmit="event.preventDefault();accept(this)"><input class="input" id="newpass" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required><input class="input" id="newpass2" type="password" placeholder="Type it again" autocomplete="new-password" minlength="8" required><div style="grid-column:1/-1">${SQA.html('i', { cert: true })}</div><button class="btn" id="inviteBtn" type="submit" style="grid-column:1/-1">Accept the invitation</button></form></div>`;
  SQA.bind('i', '#inviteBtn', { cert: true });
}
async function accept(f) {
  $('err').textContent = '';
  if ($('newpass').value !== $('newpass2').value) { $('err').textContent = 'The two passwords do not match. Please type them again.'; return; }
  const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Accepting…';
  try {
    await api({ action: 'accept', token: params.get('invite'), password: $('newpass').value, ...SQA.flags('i') });
    history.replaceState(null, '', '/account');
    document.querySelector('h1').innerHTML = 'Welcome <em>aboard.</em>';
    note('You accepted the invitation and you are signed in.');
    load();
  } catch (e) { $('err').textContent = e.message; b.disabled = false; b.textContent = 'Accept the invitation'; }
}

async function loadMembers(isOwner) {
  const box = $('members'); if (!box) return;
  let m; try { m = await api({ action: 'members' }); } catch (e) { box.innerHTML = `<p class="detail">${esc(e.message)}</p>`; return; }
  const rows = [`<li class="row"><span><strong>${esc(m.owner)}</strong></span><span class="tag on">Owner</span></li>`]
    .concat(m.members.map((x) => `<li class="row"><span>${esc(x.email)}</span><span><span class="tag ${x.accepted_at ? 'on' : ''}">${x.accepted_at ? 'Colleague' : 'Invited'}</span>${isOwner ? ` <button class="btn small ghost" data-id="${esc(x.id)}" data-email="${esc(x.email)}" onclick="removeMember(this.dataset.id, this.dataset.email)">Remove</button>` : ''}</span></li>`));
  box.innerHTML = `<ul class="people">${rows.join('')}</ul>${m.members.length ? '' : `<p class="detail">${isOwner ? 'No colleagues yet. Invite someone below, and they get their own email and password for this account.' : ''}</p>`}`;
}
async function invite(f) {
  $('err').textContent = ''; note('');
  const b = f.querySelector('button'); b.disabled = true;
  const email = $('invemail').value.trim();
  try { await api({ action: 'invite', email }); $('invemail').value = ''; note(`Invitation sent to ${esc(email)}. The link works for seven days.`); loadMembers(true); }
  catch (e) { $('err').textContent = e.message; }
  b.disabled = false;
}
async function removeMember(id, email) {
  if (!confirm(`Remove ${email}? They are signed out right away.`)) return;
  $('err').textContent = '';
  try { await api({ action: 'remove_member', id }); note(`${esc(email)} was removed and can no longer sign in.`); loadMembers(true); } catch (e) { $('err').textContent = e.message; }
}
async function changeEmail(f) {
  $('err').textContent = ''; note('');
  const b = f.querySelector('button'); b.disabled = true;
  try { const r = await api({ action: 'change_email', email: $('newemail').value.trim(), password: $('emailpass').value }); note(`Your account email is now ${esc(r.email)}. We sent a notice to both addresses.`); load(); }
  catch (e) { $('err').textContent = e.message; b.disabled = false; }
}
async function setWeekly(on) {
  $('err').textContent = '';
  try { const r = await api({ action: 'prefs', weekly: on }); const w = r.prefs.weekly !== false; $('weeklystate').textContent = w ? 'On. The summary arrives every Monday.' : 'Off. You will not get the weekly summary.'; $('weeklysw').setAttribute('aria-checked', String(w)); }
  catch (e) { $('err').textContent = e.message; }
}

async function load() {
  $('err').textContent = '';
  if (params.get('invite')) return inviteForm();
  let me; try { me = await api(); } catch (e) { $('err').textContent = e.message; return; }
  if (!me.account) return loginForm();
  const a = me.account;
  const isOwner = !a.member;
  const planLine = a.active ? `Your plan is <strong>${esc(a.planInfo.name)}</strong>, paid through ${fmtDate(a.paidThrough)}.` : (isOwner ? 'You have no active paid plan. Squadron is prepaid, so choose a plan in Billing to build and run your team.' : 'This account has no active paid plan. The account owner can choose one in Billing.');
  const who = isOwner ? `Signed in as ${esc(a.email)}, the account owner.` : `Signed in as ${esc(a.member.email)}, a colleague on the account owned by ${esc(a.email)}.`;
  let h = `<div class="card"><p class="big">${who} ${planLine}</p>
    <div class="actions"><a class="btn small" href="/billing">Billing</a><a class="btn small ghost" href="/start">Build another team</a><button class="btn small ghost" onclick="logout()">Log out</button></div></div>`;
  if (!me.businesses.length) h += `<div class="card"><p class="big">You have no teams yet.</p><div class="actions"><a class="btn small" href="/start">Build your team</a></div></div>`;
  for (const b of me.businesses) {
    const chat = b.channels && b.channels.chat && b.channels.chat.enabled;
    const t = encodeURIComponent(b.token);
    h += `<div class="card biz"><h3>${esc(b.input_value)}<span class="tag ${chat ? 'on' : ''}">${chat ? 'Chat live' : 'Not live'}</span></h3>
      <p class="detail">Created ${fmtDate(b.created_at)}.</p>
      ${b.phone_number ? `<p class="detail">Phone: ${esc(b.phone_number)}.</p>` : ''}
      ${['new', 'crawled'].includes(b.status) ? `<p class="detail">Next step: ${a.active ? 'build your Business Profile and team.' : 'pay for a plan, and your profile and team are built right away.'}</p><div class="actions"><a class="btn small" href="/start?t=${t}">Continue setup</a></div></div>` : b.status === 'profiled' ? `<p class="detail">Next step: build your team from your reviewed profile.</p><div class="actions"><a class="btn small" href="/team?t=${t}">Build the team</a><a class="btn small ghost" href="/start?t=${t}">Review the profile</a></div></div>` : `${chat ? '' : '<p class="detail">Next step: test your team, then turn chat on in Deploy.</p>'}<div class="actions"><a class="btn small" href="/hq?t=${t}">Open Squadron HQ</a><a class="btn small ghost" href="/test?t=${t}">Test the team</a><a class="btn small ghost" href="/deploy?t=${t}">Channels and settings</a></div></div>`}`;
  }
  h += `<div class="card"><p class="big" style="font-size:24px;font-weight:800">Colleagues</p>
    <p class="detail">${isOwner ? 'Colleagues sign in with their own email and password and share this account. They can use Squadron HQ, the knowledge queue, testing and settings. Only you can invite or remove colleagues, change the account email or delete the account.' : `The account owner, ${esc(a.email)}, manages colleagues, the account email and deletion.`}</p>
    <div id="members"><p class="detail">Loading colleagues.</p></div>
    ${isOwner ? `<form class="two" onsubmit="event.preventDefault();invite(this)"><input class="input" id="invemail" type="email" placeholder="Colleague's email" autocomplete="off" required><button class="btn" type="submit">Send invitation</button></form>` : ''}</div>`;
  if (isOwner) {
    const weekly = !(a.prefs && a.prefs.weekly === false);
    h += `<div class="card"><p class="big" style="font-size:24px;font-weight:800">Weekly summary email</p>
      <p class="detail">Every Monday we email ${esc(a.email)} your team's last seven days: conversations, questions waiting for you and prepaid balance left.</p>
      <div class="switchrow"><button type="button" role="switch" id="weeklysw" class="switch" aria-checked="${weekly}" aria-label="Weekly summary email" onclick="setWeekly(this.getAttribute('aria-checked') !== 'true')"><span></span></button><span class="detail" id="weeklystate" style="margin:0">${weekly ? 'On. The summary arrives every Monday.' : 'Off. You will not get the weekly summary.'}</span></div></div>`;
    h += `<div class="card"><p class="big" style="font-size:24px;font-weight:800">Account email</p>
      <p class="detail">Sign-in, invoices and notices go to ${esc(a.email)}. To change it, enter the new address and your current password. We send a notice to both addresses.</p>
      <form class="two" onsubmit="event.preventDefault();changeEmail(this)"><input class="input" id="newemail" type="email" placeholder="New email address" autocomplete="email" required><input class="input" id="emailpass" type="password" placeholder="Your current password" autocomplete="current-password" required><button class="btn" type="submit" style="grid-column:1/-1">Change the email</button></form></div>`;
    h += `<div class="card" style="border-color:rgba(255,90,90,0.55)"><p class="big" style="font-size:24px;font-weight:800">Delete my account</p>
    <p class="detail" style="color:#1E2D4A">This permanently deletes your account, every team, conversation and call recording, and every colleague login, and takes your agents offline right away. It cannot be undone, and payments are not refunded.</p>
    <form class="two" onsubmit="event.preventDefault();deleteAccount(this)"><input class="input" id="delpass" type="password" placeholder="Your password" autocomplete="current-password" required><button class="btn" type="submit" style="background:#C8102E;color:#fff;border-color:#C8102E;box-shadow:0 4px 0 #7A0A1C;font-size:17px">Delete my account now</button></form></div>`;
  }
  $('body').innerHTML = h;
  loadMembers(isOwner);
}
async function deleteAccount(f) {
  $('err').textContent = '';
  const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Deleting…';
  try { await api({ action: 'delete', password: $('delpass').value }); try { localStorage.removeItem('sqToken'); } catch (e) {} $('body').innerHTML = '<div class="card"><p class="big">Your account and everything in it are deleted.</p><div class="actions"><a class="btn small" href="/">Back to Squadron</a></div></div>'; }
  catch (e) { $('err').textContent = e.message; b.disabled = false; b.textContent = 'Delete my account now'; }
}
if (params.get('weekly') === 'off') { note('The weekly summary email is off. You can switch it back on below at any time.'); history.replaceState(null, '', '/account'); }
load();
</script>
<script src="/ace.js" defer></script>
</body>
</html>
